name: goworkbro
description: "GoWorkBro — A clean todo & focus management app with Supabase cloud sync. Built with Flutter for Android and Windows."
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database — sqflite_common_ffi works on both Android and Windows desktop
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # State management
  provider: ^6.1.2

  # Charts for Today screen
  fl_chart: ^0.69.0

  # Markdown rendering for USTC news
  flutter_markdown: ^0.7.4+3
  markdown: ^7.2.2

  # HTTP for backend API
  http: ^1.2.2

  # Supabase sync
  supabase_flutter: ^2.8.0

  # Update checker
  package_info_plus: ^8.1.2
  device_info_plus: ^11.5.0
  crypto: ^3.0.6
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

  # Desktop window management
  window_manager: ^0.4.2

  # System tray icon for Windows background mode
  tray_manager: ^0.2.3

  # Localization (Material/Widgets/Cupertino delegates)
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: 0xProto
      fonts:
        - asset: assets/fonts/0xProtoNerdFont-Regular.ttf
        - asset: assets/fonts/0xProtoNerdFont-Bold.ttf
          weight: 700
    # Chinese reading font for USTC news markdown (0xProto has no CJK glyphs)
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf