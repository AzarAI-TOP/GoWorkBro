name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze lib/
      - name: Check for secrets in code
        run: |
          if grep -r "sb_publishable_" lib/ --include="*.dart" | grep -v "local_config\|fromEnvironment\|empty_config"; then
            echo "ERROR: Hardcoded Supabase key found!"
            exit 1
          fi
          echo "No hardcoded secrets found ✓"
