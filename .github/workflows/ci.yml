name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & unit test
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      # Fail on any Supabase-style or JWT-shaped token committed to the repo.
      # The patterns require token characters after the prefix so prose that
      # merely mentions a key type does not fail the scan.
      - name: Secret scan
        run: |
          if git grep -nIE "(sb_publishable_[A-Za-z0-9_-]{10,}|sb_secret_[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{20,})" -- . ; then
            echo "::error::Secret-like token found in tracked files"
            exit 1
          fi
          echo "No hardcoded secrets found"
