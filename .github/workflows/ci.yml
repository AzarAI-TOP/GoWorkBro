name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Check for secrets in code
        run: |
          # Scan the whole tracked repo (not just lib/) for publishable and
          # secret keys plus legacy JWT-shaped anon keys — the historical
          # leak was in scripts/, which the old lib/-only scan missed.
          if git grep -nE "sb_publishable_|sb_secret_|eyJ[A-Za-z0-9_-]{20,}" -- . ':(exclude)pubspec.lock' | grep -v "fromEnvironment\|empty_config"; then
            echo "ERROR: Hardcoded Supabase key found!"
            exit 1
          fi
          echo "No hardcoded secrets found ✓"
